name: badmail.dev case
description: Propose a broken email setup for the public test zone.
title: "badmail.dev case: "
labels: [test-domain]
body:
  - type: markdown
    attributes:
      value: "[badmail.dev](https://postmasterofpuppets.com/test-domains/) is a public DNS zone with one name per broken email setup, so anyone can check a tool against a known answer."
  - type: textarea
    id: setup
    attributes:
      label: What is broken
      description: The mistake, as it happens on real domains.
    validations:
      required: true
  - type: textarea
    id: records
    attributes:
      label: Records that reproduce it
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the engine should say
      description: The verdict or the finding, and why.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: The RFC section or provider page that says so.
      placeholder: https://
    validations:
      required: true
